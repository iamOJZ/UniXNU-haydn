schema_version = 1

[device]
name = "haydn"
soc = "SM8350"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi K40 Pro (haydn, SM8350). UEFI firmware from Mu-Silicium LahainaPkg, UniXNU boot manager, board inputs taken from the device firmware FDT."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = [
  "SoC SM8350 (lahaina), 4x Cortex-A55 + 3x Cortex-A78 + 1x Cortex-X1, 12 GiB LPDDR5.",
  "Board device tree read back from the running firmware: /sys/firmware/fdt (793454 bytes) on Redmi K40 Pro haydnpro.",
  "GPT of the UFS boot LUN and of LUN4 (userdata): first_lba 2785280, last_lba 61844474, 4096-byte logical blocks.",
]
configuration = [
  "board.toml: soc = \"SM8350\", soc_source = \"sm8350\", os_profile = \"ipados-17.7.11-21H461\", kit = \"haydn\".",
  "config_fragments = arch + soc:configs/sm8350.config + os:configs/ipados.config; device patch series empty.",
  "dts/haydn.dts includes soc:dts/sm8350.dtsi, publishes a 2 GiB ADT memory window at 0x80000000 and the splash region at 0xdfc00000.",
]
procedure = [
  "adb shell su -c \"cat /sys/firmware/fdt\" -> dtc -I dtb -O dts -> docs/haydn-fdt.dts",
  "./unixnu defconfig haydn_defconfig -D ../UniXNU-haydn",
  "./unixnu fetch && ./unixnu status --json && ./unixnu tree",
]
findings = [
  "SM8350 keeps the SM8550 controller layout: GICv3 at 0x17a00000 with a 0x20000 redistributor stride, UFS host controller at 0x1d84000 with SPI 0x109, UFS PHY at 0x1d80000.",
  "The modem reservation 0x8f000000-0x9f000000 removes the venus (Mi 11) DXE heap at 0x9b800000, so the haydn heap moves to 0xa0000000 and the UEFI window stays at 0x9fd00000-0xa0000000.",
  "Userdata exposes 4096-byte logical blocks even though the boot LUN uses 512-byte blocks, so [userdata].lba_bytes = 4096.",
]
completion = [
  "All source pins resolve; every selected component has a record; status shows the intended overrides and patch order.",
]
limits = [
  "No haydn vendor UEFI binary set is published; Binaries/haydn is a copy of the venus SM8350 set.",
]
next_action = [
  "Extract the haydn XBL/UEFI firmware volumes and replace Binaries/haydn with the board set.",
]
evidence = []

[[area]]
id = "firmware"
status = "implemented"
components = ["UniXNUDxe", "UniXNURamDiskDxe", "AdvancedLogDxe", "DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]
inputs = [
  "Mu-Silicium (Project-Silicium) main, LahainaPkg provides SM8350 SEC/PEI/DXE platform support.",
  "venusPkg used as the board template: same SoC, same vendor DXE driver inventory.",
  "Redmi K40 Pro panel: qcom,mdss_dsi_k11_38_08_0a_dsc_cmd, 1080x2400, ABL splash framebuffer at 0xdfc00000.",
]
configuration = [
  "Resources/Configs/haydn.toml: [uefi_fd] base 0x9fd00000 size 0x200000, header_version 0, kernel_offset 0x8000, tags_offset 0x1e00000, pagesize 4096.",
  "Platforms/Xiaomi/haydnPkg/haydn.dsc: USE_CUSTOM_DISPLAY_DRIVER = 0 (SimpleFbDxe), SOC_TYPE = 0, FB 1080x2400x32.",
  "DSC/FDF add UniXNUPkg (Application/Driver), DarwinBoot, and map HobLib + FdtLib.",
]
procedure = [
  "python3 make-haydnpkg.py <uefi-haydn>   # generates haydnPkg from venusPkg",
  "./unixnu build firmware --uefi ../uefi-haydn",
  "./unixnu bootimg",
]
findings = [
  "The SM8350 UEFI flow publishes the initrd handed over by ABL through the SEC HOB, so UniXNURamDiskDxe + DiskIoDxe + FAT must be in the firmware volume for the payload menu to appear.",
  "haydn free System RAM below the modem hole starts at 0x9f000000, which is 13 MiB below the 0x9fd00000 FD base - enough for SEC heap, page tables and stack but not for the DXE heap.",
]
completion = [
  "Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations.",
]
limits = [
  "Firmware boot on the device and framebuffer output are not yet confirmed; see the diagnostics area for the UART capture.",
]
next_action = [
  "Boot out/haydn/ipados-17.7.11-21H461/haydn/boot/boot.img and capture ttyMSM0 at 115200 baud.",
]
evidence = []

[[area]]
id = "cpu"
status = "implemented"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = [
  "8 cores: A55 (0xd05) at MPIDR 0x000/0x100/0x200/0x300, A78 (0xd41) at 0x400/0x500/0x600, X1 (0xd44) at 0x700.",
  "GICv3 distributor 0x17a00000 (0x10000), redistributor 0x17a60000, stride 0x20000, 4 interrupt cells in the ADT encoding.",
  "Architected timer, timebase 19200000 Hz, PSCI 1.0 over SMC.",
]
configuration = [
  "soc:dts/sm8350.dtsi: cpus, psci, gic with unixnu,adt-name = \"intc\".",
  "device:dts/haydn.dts marks cpu0-3 as the E cluster and cpu4-7 as the P cluster via unixnu,cluster-type.",
  "haydn_defconfig: CONFIG_XNU_ARMCPU=y, CONFIG_XNU_ARM_DT_PLATFORM=y.",
]
procedure = [
  "./unixnu build kernel",
  "dtc -I dts -O dtb -i <soc>/dts -o haydn.dtb <device>/dts/haydn.dts",
]
findings = [
  "The SM8350 GIC uses 4-cell interrupt descriptors in this tree, matching the shared SM8550 ADT encoder expectation.",
  "No SoC patch is required for the first entry; the SM8550 native-smp-secondary series is not applied yet.",
]
completion = [
  "Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU.",
]
limits = [
  "Secondary core bring-up and IPI delivery are unverified on hardware.",
]
next_action = [
  "Confirm the kernel entry checkpoint and then enable SMP with one secondary core at a time.",
]
evidence = []

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = [
  "DRAM: 0x80000000+0x37500000, 0x200000000+0x180000000, 0xc0000000+0x14000000 (12 GiB).",
  "Reservations: HYP 6 MiB, cmd_db 128 KiB, XBL log, SMEM 2 MiB, CPUCP 1 MiB, CDSP secure heap 70 MiB, PIL 150.06 MiB, modem 256 MiB, QTEE 84 MiB, splash 35 MiB.",
  "SMMU-500 blocks at 0x15000000 (APSS) and 0x3da0000-style GPU SMMU on SM8350.",
]
configuration = [
  "haydnPkg/Library/MemoryMapLib/MemoryMapLib.c carries the board descriptor table used by SEC/PEI.",
  "[payload] dram_size = 0x80000000; [payload.adt] owned_memory_size = 0x130000000.",
]
procedure = [
  "python3 scripts/check-haydn.py (firmware preflight)",
  "./unixnu payload",
]
findings = [
  "Reserving the modem hole 0x8f000000-0x9f000000 is mandatory: the venus layout places the DXE heap inside it on haydn.",
  "The splash reservation is 0xdfc00000+0x2300000, not the 0xb8000000 region used by sheng.",
]
completion = [
  "All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy.",
]
limits = [
  "Native SMMU (ArmSmmu4K) is not enabled: no driver claims the SMMU streams yet.",
]
next_action = [
  "Validate that the UEFI memory map and the ADT window agree once firmware output is captured.",
]
evidence = []

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*"]
inputs = [
  "UFS host controller 0x1d84000 (0x3000), ICE 0x1d88000, PHY 0x1d80000, SPI 0x109, 2 lanes per direction.",
  "LUN4 userdata: 230699 MiB, GPT first_lba 2785280 last_lba 61844474 with 4096-byte blocks.",
  "Boot LUN carries xbl/abl/boot_a/boot_b/dtbo_a/super; A/B slots active on _a.",
]
configuration = [
  "[userdata] first_lba/last_lba/lba_bytes and OS + SystemOS windows.",
]
procedure = [
  "./unixnu build userdata --dry-run (after the root volume UUID is known)",
]
findings = [
  "There is no SM8350 native UFS driver: ShengUfs targets the SM8550 UFSHCI/GMU programming sequence and cannot be reused as-is.",
]
completion = [
  "Host: register, clock, link and SMMU facts match the board inventory.",
  "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.",
  "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region.",
]
limits = [
  "Storage is not adapted; the payload is served from RAM, so storage is not needed for menu and loader checkpoints.",
]
next_action = [
  "Port the UFS host controller + PHY init for lahaina, starting from the vendor UFSDxe register sequence.",
]
evidence = []

