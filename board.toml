schema_version = 2

[board]
name = "haydn"
soc = "SM8350"
soc_source = "sm8350"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi K40 Pro / K40 Pro+ / Mi 11i (haydn), SM8350"
kit = "haydn"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "haydn_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8350.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/haydn.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "haydn"
dsc = "Platforms/Xiaomi/haydnPkg/haydn.dsc"
fd = "Build/haydnPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-haydn.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "haydn"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "haydn-research"

[payload]
volume = "HAYDNESP"
size_mib = 208
loader = "firmware"
title = "Boot"
dram_size = "0x80000000"
panic_screen = true
timeout = 3
kernel_args = ["-v", "serial=3"]

[payload.adt]
# 0xCF matches the iPad7,1 platform identity seed used by the shared profile.
chip_id = "207"
owned_memory_size = "0x130000000"
root_match_volume_uuid = "00000000-0000-0000-0000-000000000000"
packed_data_ramdisk = false
persistent_data = false
unique_chip_id = "required"

[userdata]
first_lba = 2785280
last_lba = 61844474
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xdfc00000", "0x0", "0x2300000"] },
]
